  <div data-modal-root style="display:none">
    <div data-modal style="position:fixed;inset:0;z-index:180;display:flex;align-items:center;justify-content:center;padding:40px;background:rgba(3,4,10,.82);backdrop-filter:blur(22px);opacity:0;transition:opacity .5s ease">
      <div data-modal-card style="position:relative;width:100%;max-width:920px;max-height:88vh;overflow:auto;border-radius:28px;border:1px solid var(--w1,rgba(255,255,255,.1));background:linear-gradient(165deg,var(--pnlA,rgba(13,18,38,.98)),var(--pnlB,rgba(6,8,18,.99)));box-shadow:0 60px 120px -50px rgba(0,0,0,1);transform:translateY(26px) scale(.97);transition:transform .6s cubic-bezier(.16,1,.3,1)">
        <button data-modal-close data-cursor="expand" aria-label="Close" style="position:absolute;right:18px;top:18px;z-index:3;width:40px;height:40px;border-radius:13px;border:1px solid var(--w12,rgba(255,255,255,.12));background:var(--bgA7,rgba(4,6,15,.7));backdrop-filter:blur(10px);color:var(--tx,#e8ecf8);font-size:17px;cursor:pointer;transition:background .3s ease,transform .35s ease" style-hover="background:var(--w12,rgba(255,255,255,.12))">✕</button>
        <div style="position:relative;width:100%;aspect-ratio:16/8;overflow:hidden;border-radius:27px 27px 0 0;background:var(--pnlC,#080b18)">
          <div data-modal-hero style="position:absolute;inset:0"></div>
          <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(6,8,18,1),transparent 60%);pointer-events:none"></div>
        </div>
        <div style="padding:8px 34px 34px">
          <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
            <span data-modal-cat style="padding:6px 13px;border-radius:100px;font-size:11.5px;background:rgba(59,130,246,.16);border:1px solid rgba(59,130,246,.35)"></span>

          </div>

          <div data-modal-gallery style="margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px"></div>
        </div>
      </div>
    </div>
