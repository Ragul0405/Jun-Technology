{% comment %}
The furniture every standalone page needs: background effects, scroll bar,
cursor layer and the header. Kept in one place so the blog and project pages
cannot drift from the home page.
{% endcomment %}
  {% include "site/partials/_fx.html" %}

  <div data-progress style="position:fixed;left:0;top:0;height:2px;width:0%;z-index:120;background:linear-gradient(90deg,var(--a,#3b82f6),var(--b,#7c5cff));box-shadow:0 0 18px rgba(80,130,255,.9)"></div>

  <div data-cursor-layer data-hide-mobile style="position:fixed;inset:0;z-index:200;pointer-events:none">
    <canvas data-splash style="position:absolute;left:0;top:0;width:100%;height:100%"></canvas>
    <div data-cursor-ring style="position:absolute;left:0;top:0;width:36px;height:36px;margin:-18px 0 0 -18px;border:1px solid rgba(150,180,255,.55);border-radius:50%;opacity:0;transition:width .3s cubic-bezier(.16,1,.3,1),height .3s cubic-bezier(.16,1,.3,1),margin .3s cubic-bezier(.16,1,.3,1),background .3s ease,border-color .3s ease,opacity .3s ease;display:flex;align-items:center;justify-content:center;overflow:hidden">
      <span data-cursor-text style="font-family:'Sora',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:0;white-space:nowrap;transition:opacity .2s ease"></span>
    </div>
    <div data-cursor-dot style="position:absolute;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:linear-gradient(120deg,var(--a,#3b82f6),var(--b,#7c5cff));opacity:0;transition:opacity .3s ease;box-shadow:0 0 14px rgba(90,130,255,.9)"></div>
  </div>
