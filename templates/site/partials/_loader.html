{% load static %}
    <div data-loader style="position:fixed;inset:0;z-index:300;background:var(--bg,#04060f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;transition:opacity .9s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1)">
      <div style="position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center">
        <div style="position:absolute;inset:0;background:linear-gradient(140deg,#3b82f6,#1d4ed8 55%,#7c5cff);animation:morph 4s ease-in-out infinite,loaderSpin 2.8s cubic-bezier(.65,0,.35,1) infinite;opacity:.92"></div>
        <div style="position:absolute;inset:8px;background:var(--bg,#04060f);border-radius:50%"></div>
        <img src="{% if site.logo_mark %}{{ site.logo_mark.url }}{% else %}{% static 'img/jun-logo-mark.png' %}{% endif %}" alt="{{ site.brand_prefix }}{{ site.brand_suffix }}" width="46" height="38" style="position:relative;display:block;width:46px;height:auto">
      </div>
      <div style="width:220px;height:2px;background:var(--w09,rgba(255,255,255,.09));border-radius:2px;overflow:hidden">
        <div data-loader-bar style="width:0%;height:100%;background:linear-gradient(90deg,#3b82f6,#7c5cff);transition:width .28s linear"></div>
      </div>
      <div style="font-family:'Sora',sans-serif;font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;color:var(--tx4,rgba(232,236,248,.4))">{{ site.brand_prefix }} {{ site.brand_suffix }}</div>
    </div>
