{% load site_extras %}
  <section id="stats" data-screen-label="Stats" style="position:relative;z-index:1;padding:20px 40px 60px">
    <div style="max-width:1200px;margin:0 auto;padding:42px 30px;border-radius:28px;border:1px solid var(--w07,rgba(255,255,255,.07));background:linear-gradient(160deg,var(--w05,rgba(255,255,255,.05)),var(--w012,rgba(255,255,255,.012)));backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:28px;box-shadow:0 40px 90px -50px rgba(0,0,0,.95)">
      {% for stat in stats %}
      <div data-reveal data-delay="{{ forloop.counter0|stagger:90 }}" style="text-align:center;opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)">
        <div data-stat-icon style="width:42px;height:42px;margin:0 auto 14px;border-radius:13px;border:1px solid var(--w1,rgba(255,255,255,.1));background:{{ stat.accent_icon_bg }};display:flex;align-items:center;justify-content:center;transition:transform .7s cubic-bezier(.16,1,.3,1)">
          {% icon stat.icon stroke=stat.accent_stroke size="19px" %}
        </div>
        <div data-count="{{ stat.value }}" data-suffix="{{ stat.suffix }}" style="font-family:'Sora',sans-serif;font-size:clamp(32px,3.3vw,44px);font-weight:600;letter-spacing:-.035em;background:linear-gradient(100deg,{{ stat.accent_text_gradient }});-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">0</div>
        <div style="margin-top:6px;font-size:13px;color:var(--tx5,rgba(232,236,248,.5))">{{ stat.label }}</div>
      </div>
      {% endfor %}
    </div>
  </section>
