{% extends "site/base.html" %}
{% block title %}Something went wrong{% endblock %}
{% block body %}
<div data-root data-theme="dark" style="position:relative;min-height:100vh;background:var(--bg,#04060f);color:var(--tx,#e8ecf8);display:flex;align-items:center;justify-content:center;padding:40px;overflow:hidden">
  {% include "site/partials/_fx.html" %}
  <div style="position:relative;z-index:1;text-align:center;max-width:520px">
    <div style="font-family:'Sora',sans-serif;font-size:11.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--acc2,#c4b5fd)">Error 500</div>
    <h1 style="margin:16px 0 0;font-family:'Sora',sans-serif;font-weight:600;font-size:clamp(32px,5vw,52px);letter-spacing:-.035em">Something went wrong</h1>
    <p style="margin:14px 0 0;font-size:15.5px;line-height:1.7;color:var(--tx55,rgba(232,236,248,.55))">We hit an unexpected error. Please try again in a moment.</p>
    <a href="/" style="display:inline-block;margin-top:28px;padding:16px 28px;border-radius:18px;font-family:'Sora',sans-serif;font-size:14.5px;font-weight:500;color:#fff;background:linear-gradient(120deg,#3b82f6,#6d5cff);box-shadow:0 20px 44px -18px rgba(70,110,255,.95)">Back to home</a>
  </div>
</div>
{% endblock %}
